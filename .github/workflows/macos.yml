# macOS checks for the desktop shell.
#
# The Windows port changes Rust code macOS shares (computer control's helper, the working rings,
# key handling) and is written without a Mac, so this is where that code compiles and its tests
# run on macOS.
name: macOS

on:
  push:
    # `ci/**` branches try workflow changes before they reach the port branch.
    branches: [windows-native-port, 'ci/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust shell
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # The toolchain the port is built and tested with.
      - uses: dtolnay/rust-toolchain@1.96.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      # `tauri.conf.json` points `frontendDist` at the built UI. A debug build does not embed it,
      # but the folder has to exist.
      - name: UI folder for the build script
        run: mkdir -p packages/ui/dist/app

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked --all-targets

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --lib
