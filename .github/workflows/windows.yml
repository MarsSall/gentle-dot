# Windows checks for the native Windows port.
#
# The desktop shell is mostly written on Linux and macOS, where its `cfg(windows)` code never
# compiles, so this is where that code meets a real `x86_64-pc-windows-msvc` toolchain.
name: Windows

on:
  push:
    branches: [windows-native-port]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The toolchain the Windows port is built and tested with.
      - uses: dtolnay/rust-toolchain@1.96.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      # `tauri.conf.json` points `frontendDist` at the built UI. A debug build does not embed it,
      # but the folder has to exist, and building the UI here would add the whole pnpm install.
      - name: UI folder for the build script
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path packages/ui/dist/app | Out-Null

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked --all-targets

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --lib

  typescript:
    name: TypeScript (daemon, protocol, UI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # No `version`: package.json declares the pnpm version.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # gentle-pi's postinstall builds its Gentle AI binary from source on Windows and needs
      # Go 1.25.10 or newer, newer than the Go on the windows-latest image.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
